<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie de voitures</title>

  <!-- CSS -->
    <link rel="stylesheet" href="v2.css">
</head>
<body>

  <h1>Galerie de voitures</h1>

  <div class="gallery">

    <!-- Voiture 1 -->
    <div class="car-card">
      <div class="car-photo">
        <img src="g.ipj.jpg" alt="voiture1">

      </div>
      <div class="car-info">
        <h2>Nom du chauffeur : <span>Ledada</span></h2>
        <p>Matricule : <span>6684 TBH</span></p>
        <p>Vitesse maximale sur la route : <span>75 km/h</span></p>
        <p>Coopérative : <span>Ten Bit-road</span></p>
      </div>
    </div>

    <!-- Voiture 2 -->
    <div class="car-card">
      <div class="car-photo">
        <img src="sp.ipj.jpg" alt="voiture1"
        <img src="https://via.placeholder.com/300x200" alt="Voiture 2">
      </div>
      <div class="car-info">
        <h2>Nom du chauffeur : <span>vincent</span></h2>
        <p>Matricule : <span>2356BT</span></p>
        <p>Vitesse maximale sur la route : <span>80 km/h</span></p>
        <p>Coopérative :Ten Bit-road <span>ADR Travel</span></p>

    </div>

  </div>

</html>
