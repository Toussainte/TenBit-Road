<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Galerie de voitures</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Galerie de voitures</h1>

<div class="galerie">

    <div class="carte">
        <img src="voiture1.jpg" alt="Voiture 1">

        <div class="infos">
            <h2>Toyota Land Cruiser</h2>
            <p><strong>Année :</strong> 2022</p>
            <p><strong>Carburant :</strong> Diesel</p>
            <p><strong>Transmission :</strong> Manuelle</p>
            <p><strong>Prix :</strong> 45 000 €</p>
        </div>
    </div>

    <div class="carte">
        <img src="voiture2.jpg" alt="Voiture 2">

        <div class="infos">
            <h2>Nissan Patrol</h2>
            <p><strong>Année :</strong> 2021</p>
            <p><strong>Carburant :</strong> Essence</p>
            <p><strong>Transmission :</strong> Automatique</p>
            <p><strong>Prix :</strong> 48 000 €</p>
        </div>
    </div>

</div>

</body>
</html>
